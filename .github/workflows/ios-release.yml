name: iOS 编译打包与发布

on:
  # 支持手动构建指定分支，使用与推送发布相同的验证和打包步骤。
  workflow_dispatch:
  push:
    branches: [dev]
    tags: ['v*']

# 发布到当前仓库的 Releases，不需要配置个人 Token 或签名证书。
permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

defaults:
  run:
    shell: bash

jobs:
  build-and-release:
    name: 构建和发布未签名 IPA
    # 使用官方 macOS 15 ARM 托管机，镜像提供下方指定的 Xcode 版本。
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # 固定项目所需的 Xcode 版本，工具缺失时直接失败。
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - name: 检出源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6，固定上游提交
        with:
          persist-credentials: false

      - name: 检查工具和资源
        run: |
          mkdir -p artifacts/dist
          xcodebuild -version
          swift --version
          plutil -lint Legado.xcodeproj/project.pbxproj
          python3 -m json.tool App/Resources/httpTTS.json > /dev/null
          python3 -m json.tool App/Resources/txtTocRule.json > /dev/null

      - name: 解析 iOS 依赖
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Legado.xcodeproj -scheme Legado \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            2>&1 | tee artifacts/package-resolution.log
          xcodebuild -showBuildSettings -json \
            -project Legado.xcodeproj -scheme Legado -configuration Release \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -disableAutomaticPackageResolution > artifacts/build-settings.json

      - name: 生成版本信息
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # 版本来自工程，构建号叠加工作流序号，使后续开发版保持递增。
          targets = json.loads(Path("artifacts/build-settings.json").read_text())
          settings = next(item["buildSettings"] for item in targets if item["target"] == "Legado")
          version = settings["MARKETING_VERSION"]
          build = int(settings["CURRENT_PROJECT_VERSION"]) + int(os.environ["GITHUB_RUN_NUMBER"])
          tag = os.environ["GITHUB_REF_NAME"] if os.environ["GITHUB_REF_TYPE"] == "tag" else f"v{version}-dev.{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\nbuild={build}\ntag={tag}\nprerelease={str('-' in tag).lower()}\n")
          PY

      - name: 验证模拟器构建
        run: |
          xcodebuild -project Legado.xcodeproj -scheme Legado \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee artifacts/simulator-build.log

      - name: 归档真机架构
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project Legado.xcodeproj -scheme Legado \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -disableAutomaticPackageResolution \
            -archivePath artifacts/Legado.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee artifacts/archive.log

      - name: 打包并核验 IPA
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # 使用标准 Payload 目录封装归档产物，不修改可执行文件或补造签名。
          package_dir="$RUNNER_TEMP/legado-package"
          mkdir -p "$package_dir/Payload"
          ditto artifacts/Legado.xcarchive/Products/Applications/Legado.app "$package_dir/Payload/Legado.app"
          ipa_path="$GITHUB_WORKSPACE/artifacts/dist/legado-ios-$RELEASE_TAG-build$BUILD_NUMBER-unsigned.ipa"
          ditto -c -k --keepParent "$package_dir/Payload" "$ipa_path"
          python3 - <<'PY'
          import hashlib
          import os
          import plistlib
          import zipfile
          from pathlib import Path

          # 验证包结构、版本和 ZIP 完整性后再生成校验文件与发布说明。
          tag = os.environ["RELEASE_TAG"]
          build = os.environ["BUILD_NUMBER"]
          version = os.environ["APP_VERSION"]
          ipa = Path(f"artifacts/dist/legado-ios-{tag}-build{build}-unsigned.ipa")
          with zipfile.ZipFile(ipa) as package:
              assert package.testzip() is None, "IPA 的 ZIP 数据损坏"
              info = plistlib.loads(package.read("Payload/Legado.app/Info.plist"))
              assert info["CFBundleShortVersionString"] == version, "IPA 版本与工程不一致"
              assert str(info["CFBundleVersion"]) == build, "IPA 构建号与工作流不一致"
              package.getinfo(f"Payload/Legado.app/{info['CFBundleExecutable']}")
          with ipa.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          ipa.with_suffix(".ipa.sha256").write_text(f"{digest}  {ipa.name}\n", encoding="utf-8")
          notes = (
              f"版本：{version}，构建号：{build}\n\n"
              "提供未签名 IPA，下载后需自行签名安装。\n\n"
              "构建已通过：iOS 模拟器构建、真机架构归档、IPA 完整性检查。"
              "本工作流不运行自动化测试；未进行真机运行或付费 MiMo API 调用。\n\n"
              f"源码提交：{os.environ['GITHUB_SHA']}\n\n"
              + Path("CHANGELOG.md").read_text(encoding="utf-8")
          )
          Path("artifacts/release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: 保存安装包和校验文件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7，固定上游提交
        with:
          name: legado-ios-${{ steps.version.outputs.tag }}
          path: artifacts/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # dev 推送发布独立的开发预览版；版本标签按是否含预发布标识确定类型。
          release_flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_flags+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" artifacts/dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --notes-file artifacts/release-notes.md \
            "${release_flags[@]}"
